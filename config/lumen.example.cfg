-- lumen.cfg - LUMEN's settings. lumen-setup writes /home/lumen.cfg for you; or copy this there and change what
-- you need. Anything left out (or the whole file) takes the default shown. Every option: docs/configuration.md.
return {
  -- Seconds between readings.
  interval = 5,

  -- Names on screen (and in LENS), by the start of each LSC's address (lumen-discover --read shows them).
  -- Unnamed LSCs show as "LSC" and the first four characters of their address.
  names = {
    -- ["d2440f27"] = "Main",
  },

  -- Fewer, bigger characters for a wall of screens: { width, height }. nil: the screen's largest.
  -- resolution = { 80, 25 },

  -- Alerts.
  lowFill = 25,          -- warn below this % full
  criticalFill = 10,     -- bad below this % full
  drainWarnHours = 4,    -- warn when draining and empty within this many hours
  drainBadHours = 1,     -- bad when empty within this many hours
  drainAverage = "1h",   -- the net those use for LSCs without switches: "5s", "5m" or "1h"
  inputDrop = nil,       -- warn when 5 min input falls this % below the hour's (nil: don't; not for
                         -- generators that cycle by themselves)
  maxPassiveLoss = nil,  -- warn when passive loss is above this EU/t (nil: don't)
  heatWarn = 25,         -- warn when a reactor is at this % of its max heat
  heatBad = 50,          -- bad at this %
  beep = true,           -- beep when a bad alert appears

  -- Generators to show (by the start of their adapter's address). IC2 reactors show by themselves.
  sources = {
    -- { address = "a1b2c3d4", name = "LFTR", alwaysOn = true },   -- alwaysOn: warn when it stops
  },

  -- Switches: generators on below onBelow % full, off above offAbove %. A redstone signal (Redstone I/O block
  -- or card, a side; invert = true when a signal means stop) or a GT machine's work switch (machine = ...).
  control = {
    -- { name = "Vac nuke", redstone = "5e1f0000", side = "north", onBelow = 30, offAbove = 90, source = "Vac nuke" },
    -- { name = "LFTR", machine = "a1b2c3d4", lsc = "Main", onBelow = 50, offAbove = 95 },
  },

  -- Reporting to LENS (needs a network card). nil: don't report.
  lensPort = nil,        -- 4243 is LENS's default
  lensNode = "lumen",    -- this computer's name in LENS
  lensToken = nil,       -- the hub's token, if it has one
}
