-- lumen.cfg - LUMEN's settings. Copy to /home/lumen.cfg and change what you need; anything left out (or
-- the whole file) takes the default shown. Every option: docs/configuration.md.
return {
  -- Seconds between readings.
  interval = 5,

  -- Names on screen (and in LENS), by the start of each LSC's address (lumen-discover --read shows them).
  -- Unnamed LSCs show as "LSC" and the first four characters of their address.
  names = {
    -- ["d2440f27"] = "Main",
  },

  -- Fewer, bigger characters for a wall of screens: { width, height }. nil: the screen's largest.
  -- resolution = { 80, 25 },

  -- Alerts.
  lowFill = 25,          -- warn below this % full
  criticalFill = 10,     -- bad below this % full
  drainWarnHours = 4,    -- warn when draining and empty within this many hours
  drainBadHours = 1,     -- bad when empty within this many hours
  beep = true,           -- beep when a bad alert appears

  -- Reporting to LENS (needs a network card). nil: don't report.
  lensPort = nil,        -- 4243 is LENS's default
  lensNode = "lumen",    -- this computer's name in LENS
  lensToken = nil,       -- the hub's token, if it has one
}
